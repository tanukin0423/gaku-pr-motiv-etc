<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エントリーシート作成支援ツール</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #f7f7f7ec;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        label, p {
            margin-top: 10px;
            display: block;
        }
        textarea {
            width: 100%;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
        }
        select, button {
            width: 100%;

            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            background: #fff;
        }

            color: #fff;

        }

        }

            font-weight: bold;
        }
        .example-container {
            margin-bottom: 20px;
        }
        .example {
            background: #f0f0f0;
            padding: 10px;
            border-left: 5px solid #4CAF50;
            margin-bottom: 10px;
        }
        .example strong {
            font-weight: bold;
        }
       
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            textarea {
                font-size: 14px;
            }
            select, button {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>エントリーシート作成支援ツール</h1>

    <label for="selectItem">項目を選択してください:</label>

        <option value="activities">学生時代に取り組んだこと</option>

    <p id="totalCharCount">合計文字数: 0</p>
    <button id="saveButton">保存</button>

document.getElementById('selectItem').addEventListener('change', function() {
    var selected = this.value;
    var questionArea = document.getElementById('questionArea');
    questionArea.innerHTML = '';
    if (selected && questions[selected]) {
        var exampleContainer = document.createElement('div');
        exampleContainer.className = 'example-container';
        examples[selected].forEach(function(example, index) {
            var exampleDiv = document.createElement('div');
            exampleDiv.className = 'example';
            var title = document.createElement('strong');
            title.textContent = 'サンプル文例' + (index + 1) + ':';
            exampleDiv.appendChild(title);
            exampleDiv.appendChild(document.createElement('br'));
            exampleDiv.appendChild(document.createTextNode(example));
            exampleContainer.appendChild(exampleDiv);
        });
        questionArea.appendChild(exampleContainer);
        questions[selected].forEach(function(question, index) {
            var label = document.createElement('label');
            label.textContent = question;
            var textarea = document.createElement('textarea');
            textarea.rows = 4;
            textarea.dataset.question = index;
            textarea.addEventListener('input', updateCharCount);
            questionArea.appendChild(label);
            questionArea.appendChild(textarea);
        });
    }
    updateTotalCharCount();
});

function updateCharCount() {
    var totalCharCount = 0;
    var textareas = document.querySelectorAll('#questionArea textarea');
    textareas.forEach(function(textarea) {
        totalCharCount += textarea.value.length;
    });
    document.getElementById('totalCharCount').textContent = '合計文字数: ' + totalCharCount;
}

function updateTotalCharCount() {
    var totalCharCount = 0;
    var textareas = document.querySelectorAll('#questionArea textarea');
    textareas.forEach(function(textarea) {
        totalCharCount += textarea.value.length;
    });
    document.getElementById('totalCharCount').textContent = '合計文字数: ' + totalCharCount;
}

document.getElementById('saveButton').addEventListener('click', function() {
    var selected = document.getElementById('selectItem').value;
    if (!selected) return;

    var textareas = document.querySelectorAll('#questionArea textarea');
    var content = '';
    textareas.forEach(function(textarea) {
        content += questions[selected][textarea.dataset.question] + '\n' + textarea.value + '\n\n';
    });

    var totalCharCount = document.getElementById('totalCharCount').textContent;

    var blob = new Blob([content + '\n' + totalCharCount], { type: 'text/plain' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = selected + '_entry_sheet.txt';
    link.click();
});
</script>
</body>
</html>
